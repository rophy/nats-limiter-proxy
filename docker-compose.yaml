services:
  nats:
    image: nats:2.11.4-alpine3.21
    volumes:
      - ./local/nats:/etc/nats
      - nats-jwt:/jwt
      - nats-data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
  nats-box:
    image: natsio/nats-box:0.18.0-nonroot
    init: true
    command: ["sleep", "infinity"]
    volumes:
      - ./local/nsc:/nsc
      - ./local/scripts:/scripts
  
  proxy:
    image: nats-limiter-proxy
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      UPSTREAM_HOST: nats
      UPSTREAM_PORT: "4222"
      LOG_LEVEL: "debug"
      SERVICE_NAME: "proxy"  # Service name for peer discovery
      # POD_IP: not needed - Docker Compose uses network route detection
    ports:
      - "4223-4225:4223"  # NATS proxy ports (range)
      - "8081-8083:8081"  # Gossip communication ports (range)
    volumes:
      - ./config-distributed.yaml:/app/config.yaml:ro
    depends_on:
      - nats
    deploy:
      replicas: 3
volumes:
  nats-jwt:
  nats-data:
