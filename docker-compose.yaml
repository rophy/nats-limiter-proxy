services:
  nats:
    image: nats:2.11.4-alpine3.21
    volumes:
      - ./local/nats:/etc/nats
      - nats-jwt:/jwt
      - nats-data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
  nats-box:
    image: natsio/nats-box:0.18.0-nonroot
    init: true
    command: ["sleep", "infinity"]
    volumes:
      - ./local/nsc:/nsc
      - ./local/scripts:/scripts
  
  # Redis master for rate limiting
  redis-master:
    image: redis:7-alpine
    command: redis-server --appendonly yes --replica-announce-ip redis-master
    ports:
      - "6379:6379"
    
  # Redis Sentinel for functional testing  
  redis-sentinel:
    image: redis:7-alpine
    command: >
      sh -c "
        echo 'Waiting for Redis master to be ready...' &&
        until redis-cli -h redis-master -p 6379 ping; do
          echo 'Redis master not ready, waiting...'
          sleep 2
        done &&
        echo 'Redis master is ready, starting Sentinel...' &&
        redis-sentinel /etc/redis/sentinel.conf
      "
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
  
  proxy:
    image: nats-limiter-proxy
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      UPSTREAM_HOST: nats
      UPSTREAM_PORT: "4222"
      LOG_LEVEL: "debug"
    ports:
      - "4223-4225:4223"  # NATS proxy ports (range)
    volumes:
      - ./config-redis.yaml:/app/config.yaml:ro
    depends_on:
      - nats
      - redis-master
      - redis-sentinel
    deploy:
      replicas: 3
volumes:
  nats-jwt:
  nats-data:
