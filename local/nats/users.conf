# Centralized authorization - supports multiple authentication methods
authorization: {
    # Method 1: Username/Password Authentication
    users: [
        {
            user: "alice"
            password: "alicepass"
            permissions: {
                publish: ["foo.>", "bar.>"]
                subscribe: ["foo.>", "bar.>", "_INBOX.>"]
            }
        },
        {
            user: "bob"
            password: "bobpass"
            permissions: {
                publish: ["test.>"]
                subscribe: ["test.>", "_INBOX.>"]
            }
        },
        {
            user: "admin"
            password: "adminpass"
            permissions: {
                publish: [">"]
                subscribe: [">"]
            }
        },
        
        # Method 2: NKey Authentication (standalone, not JWT+NKey combo)
        {
            nkey: "UC6NLCN7AS34YOJVCYD4PJ3QB7QGLYG5B5IMBT25VW5K4TNUJODM7BOX"
            permissions: {
                publish: ["nkey.>"]
                subscribe: ["nkey.>", "_INBOX.>"]
            }
        },
        {
            nkey: "UDXU4RCSJNZOIQHZNWXHXORDPRTGNJAHAHFRGZNEEJCPQTT2M7NLCNF4"
            permissions: {
                publish: ["nkey2.>"]
                subscribe: ["nkey2.>", "_INBOX.>"]
            }
        },
        
        # Method 3: TLS Certificate Mapped Users
        # These users will be mapped from TLS certificate fields
        {
            user: "alice@company.com"  # Mapped from cert email SAN
            permissions: {
                publish: ["tls.>", "secure.>"]
                subscribe: ["tls.>", "secure.>", "_INBOX.>"]
            }
        },
        {
            user: "system-client"     # Mapped from cert CN
            permissions: {
                publish: ["system.>"]
                subscribe: ["system.>", "_INBOX.>"]
            }
        }
    ]
    
}

# TLS Configuration for certificate-based authentication
# Uncomment to enable TLS and certificate authentication
# tls: {
#     cert_file: "/etc/nats/server.crt"
#     key_file: "/etc/nats/server.key"
