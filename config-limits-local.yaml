# New limits-based configuration for local rate limiting
limits:
  defaults:
    bps_local: 102400   # 100KB/s per proxy instance
    bps_global: 102400  # 100KB/s for all proxies combined (ignored in local mode)
  
  users:
    # Username/password authentication
    - user: alice
      bps_local: 5242880  # 5MB/s per proxy instance
      bps_global: 5242880 # 5MB/s for all proxies combined
    - user: bob
      bps_local: 2097152  # 2MB/s per proxy instance
      bps_global: 2097152 # 2MB/s for all proxies combined
    
    # TLS certificate mapped users
    - user: "alice@company.com"  # Mapped from cert email
      bps_local: 2097152  # 2MB/s per proxy instance
      bps_global: 4194304 # 4MB/s for all proxies combined
    - user: "system-client"      # Mapped from cert CN
      bps_local: 10485760 # 10MB/s per proxy instance
      bps_global: 10485760 # 10MB/s for all proxies combined
    
    # NKey authentication (NKey public key as user identifier)
    - user: "UC6NLCN7AS34YOJVCYD4PJ3QB7QGLYG5B5IMBT25VW5K4TNUJODM7BOX"
      bps_local: 1048576  # 1MB/s per proxy instance
      bps_global: 2097152 # 2MB/s for all proxies combined
    - user: "UDXU4RCSJNZOIQHZNWXHXORDPRTGNJAHAHFRGZNEEJCPQTT2M7NLCNF4"
      bps_local: 3145728  # 3MB/s per proxy instance
      bps_global: 3145728 # 3MB/s for all proxies combined
    
    # Token authentication (token value as user identifier)
    - user: "s3cr3t"  # Token value
      bps_local: 512000   # 500KB/s per proxy instance
      bps_global: 1024000 # 1MB/s for all proxies combined
    - user: "another-token-123"
      bps_local: 256000   # 250KB/s per proxy instance
      bps_global: 512000  # 500KB/s for all proxies combined

# Local rate limiting only - no Redis coordination
redis:
  enabled: false