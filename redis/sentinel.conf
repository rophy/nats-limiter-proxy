port 26379

# Bind to all interfaces
bind 0.0.0.0

# Monitor the Redis master
sentinel monitor mymaster redis-master 6379 1

# Authentication (if needed)
# sentinel auth-pass mymaster yourpassword

# How long to wait before considering master down (milliseconds)
sentinel down-after-milliseconds mymaster 5000

# Timeout for failover operations (milliseconds)
sentinel failover-timeout mymaster 10000

# How many replicas can be reconfigured simultaneously during failover
sentinel parallel-syncs mymaster 1

# Announce Sentinel IP for Docker networking
sentinel announce-ip redis-sentinel
sentinel announce-port 26379

# Resolve hostnames when starting
sentinel resolve-hostnames yes
sentinel announce-hostnames yes